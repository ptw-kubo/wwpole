<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global AI Readiness Survey</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #5d6979;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --accent-soft: #e7f5f2;
      --warn: #9a3412;
      --warn-soft: #fff3e8;
      --shadow: 0 16px 40px rgba(24, 33, 47, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Yu Gothic UI", "Microsoft YaHei", "Meiryo", system-ui, sans-serif;
      line-height: 1.65;
    }

    header {
      background: #172033;
      color: #fff;
      border-bottom: 5px solid var(--accent);
    }

    .header-inner {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #b9d6d2;
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.4vw, 2.2rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .header-copy {
      max-width: 860px;
      margin: 14px 0 0;
      color: #d9e1ec;
      font-size: 0.98rem;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 24px auto 56px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    aside, .intro, .access-panel, fieldset, .actions, .result-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    aside {
      position: sticky;
      top: 16px;
      padding: 18px;
    }

    .language-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .lang-button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: #203047;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .lang-button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .status-title {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 800;
    }

    .progress {
      height: 12px;
      background: #e6eaf0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .progress-text, .hint, .counter {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .notice {
      margin-top: 18px;
      padding: 14px;
      background: var(--warn-soft);
      border: 1px solid #fed7aa;
      border-radius: var(--radius);
      color: #5f2a0a;
      font-size: 0.9rem;
    }

    .notice strong {
      display: block;
      margin-bottom: 4px;
      color: var(--warn);
    }

    .intro {
      padding: 22px 24px;
      margin-bottom: 18px;
    }

    .access-panel {
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .access-panel h2 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .access-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
      gap: 14px;
      align-items: end;
      margin-top: 12px;
    }

    .access-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .company-code {
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .response-code-input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 12px;
      font: inherit;
      text-transform: uppercase;
    }

    .access-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .intro h2, .result-panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .intro p, .result-panel p {
      margin: 8px 0;
      color: var(--muted);
    }

    fieldset {
      margin: 0 0 18px;
      padding: 0;
      overflow: hidden;
    }

    legend {
      width: 100%;
      padding: 14px 20px;
      background: #eef4f8;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
      color: #203047;
    }

    .question {
      padding: 20px;
      border-bottom: 1px solid #edf0f4;
    }

    .question:last-child { border-bottom: 0; }

    .question-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .num {
      flex: 0 0 auto;
      min-width: 36px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border: 1px solid #b6ded8;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .question-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      white-space: pre-line;
    }

    .meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
    }

    .option:hover {
      border-color: #9fb1c6;
      background: #fbfcfe;
    }

    input[type="radio"], input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    .error {
      margin: 8px 0 0;
      color: #b91c1c;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .actions {
      padding: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .action-button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 0 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover { background: var(--accent-dark); }

    .secondary {
      background: #fff;
      color: #203047;
      border-color: var(--line);
    }

    .secondary:hover { background: #f1f5f9; }

    .result-panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
    }

    .result-panel.active { display: block; }

    .download-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { position: static; }
    }

    @media (max-width: 560px) {
      .header-inner, main { width: min(100% - 20px, 1120px); }
      .intro, .access-panel, .question, .actions, .result-panel { padding: 16px; }
      .access-grid { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .action-button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="eyebrow">Global AI Readiness Benchmark</p>
      <h1 id="pageTitle"></h1>
      <p class="header-copy" id="pageLead"></p>
    </div>
  </header>

  <main>
    <aside aria-label="Survey controls">
      <div class="language-switcher" id="languageSwitcher"></div>
      <p class="status-title" id="progressTitle"></p>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-text" id="progressText"></p>
      <div class="notice">
        <strong id="noticeTitle"></strong>
        <span id="noticeBody"></span>
      </div>
    </aside>

    <form id="surveyForm" novalidate>
      <section class="access-panel" aria-labelledby="accessTitle">
        <h2 id="accessTitle"></h2>
        <p class="access-note" id="accessLead"></p>
        <div class="access-grid">
          <div class="access-field">
            <label id="companyCodeLabel"></label>
            <div class="company-code" id="companyCodeDisplay"></div>
          </div>
          <div class="access-field">
            <label for="responseCode" id="responseCodeLabel"></label>
            <input class="response-code-input" id="responseCode" name="response_code" type="text" autocomplete="one-time-code" maxlength="80">
          </div>
        </div>
        <p class="access-note" id="responseCodeHint"></p>
      </section>

      <section class="intro" aria-labelledby="introTitle">
        <h2 id="introTitle"></h2>
        <p id="introP1"></p>
        <p id="introP2"></p>
        <p id="introP3"></p>
      </section>

      <div id="questionContainer"></div>

      <div class="actions">
        <button class="action-button secondary" type="button" id="clearButton"></button>
        <button class="action-button primary" type="submit" id="submitButton"></button>
      </div>

      <section class="result-panel" id="resultPanel" aria-live="polite">
        <h2 id="resultTitle"></h2>
        <p id="resultBody"></p>
        <div class="download-row">
          <button class="action-button primary" type="button" id="downloadJson"></button>
          <button class="action-button secondary" type="button" id="downloadCsv"></button>
        </div>
      </section>
    </form>
  </main>

    const state = {
      language: pickInitialLanguage(),
      latestResponse: null
    };

    const respondentIdKey = "global_ai_readiness_survey.respondent_id";

    const form = document.getElementById("surveyForm");
    const questionContainer = document.getElementById("questionContainer");
    const resultPanel = document.getElementById("resultPanel");

    function pickInitialLanguage() {
      const browserLanguage = (navigator.language || "ja").toLowerCase();
      if (browserLanguage.startsWith("fr")) return "fr";
      if (browserLanguage.startsWith("pt")) return "pt";
      if (browserLanguage.startsWith("vi")) return "vi";
      if (browserLanguage.startsWith("ko")) return "ko";
      if (browserLanguage.startsWith("zh")) return "zh";
      if (browserLanguage.startsWith("es")) return "es";
      if (browserLanguage.startsWith("en")) return "en";
      return "ja";
    }

    function t(path, replacements = {}) {
      const [group, key] = path.split(".");
      const languageBundle = i18n[state.language] || i18n.en;
      let value = languageBundle[group][key] || i18n.en[group][key];
      Object.entries(replacements).forEach(([token, replacement]) => {
        value = value.replace(`{${token}}`, replacement);
      });
      return value;
    }

    function safeStorageGet(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (error) {
        return "";
      }
    }

    function safeStorageSet(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (error) {
        // Storage can be unavailable in restricted browser modes.
      }
    }

    function createUuid() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (char) => (
        Number(char) ^ window.crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> Number(char) / 4
      ).toString(16));
    }

    function getRespondentId() {
      const existing = safeStorageGet(respondentIdKey);
      if (existing) return existing;
      const created = createUuid();
      safeStorageSet(respondentIdKey, created);
      return created;
    }

    function markSubmitted() {
      const key = getSubmissionKey();
      if (key) safeStorageSet(key, "true");
    }

    function getCompanyCode() {
      const params = new URLSearchParams(window.location.search);
      return (params.get("company") || "").trim().toLowerCase();
    }

    function getResponseCode() {
      const field = document.getElementById("responseCode");
      return field ? field.value.trim().toUpperCase() : "";
    }

    function getSubmissionKey() {
      const companyCode = getCompanyCode();
      const responseCode = getResponseCode();
      if (!companyCode || !responseCode) return "";
      return `global_ai_readiness_survey.submitted.${companyCode}.${responseCode}`;
    }

    function hasSubmittedBefore() {
      const key = getSubmissionKey();
      return key ? safeStorageGet(key) === "true" : false;
    }

    function optionLabel(code) {
      const languageOptions = optionText[state.language] || optionText.en;
      return languageOptions[code] || optionText.en[code] || code;
    }

    function questionLabel(id) {
      const languageQuestions = questionText[state.language] || questionText.en;
      return languageQuestions[id] || questionText.en[id] || id;
    }

    function getSavedAnswers() {
      const answers = {};
      Object.keys(questions).forEach((id) => {
        answers[id] = getValue(id);
      });
      return answers;
    }

    function restoreAnswers(answers) {
      Object.entries(answers).forEach(([id, value]) => {
        const question = questions[id];
        if (!question) return;
        if (question.type === "text") {
          const field = form.querySelector(`[name="${id}"]`);
          if (field) field.value = value || "";
          return;
        }
        const values = Array.isArray(value) ? value : [value];
        values.filter(Boolean).forEach((selectedValue) => {
          const field = form.querySelector(`[name="${id}"][value="${selectedValue}"]`);
          if (field) field.checked = true;
        });
      });
      updateTextCounter();
      updateProgress();
    }

    function renderLanguageSwitcher() {
      const switcher = document.getElementById("languageSwitcher");
      switcher.innerHTML = languages.map((language) => (
        `<button class="lang-button${language.code === state.language ? " active" : ""}" type="button" data-language="${language.code}">${language.label}</button>`
      )).join("");
    }

    function renderStaticText() {
      const language = languages.find((item) => item.code === state.language);
      document.documentElement.lang = language.htmlLang;
      document.title = t("ui.title");
      document.getElementById("pageTitle").textContent = t("ui.title");
      document.getElementById("pageLead").textContent = t("ui.lead");
      document.getElementById("progressTitle").textContent = t("ui.progressTitle");
      document.getElementById("noticeTitle").textContent = t("ui.noticeTitle");
      document.getElementById("noticeBody").textContent = t("ui.noticeBody");
      document.getElementById("accessTitle").textContent = t("ui.accessTitle");
      document.getElementById("accessLead").textContent = t("ui.accessLead");
      document.getElementById("companyCodeLabel").textContent = t("ui.companyCode");
      document.getElementById("responseCodeLabel").textContent = t("ui.responseCode");
      document.getElementById("responseCodeHint").textContent = t("ui.responseCodeHint");
      document.getElementById("companyCodeDisplay").textContent = getCompanyCode() || t("ui.missingCompany");
      document.getElementById("introTitle").textContent = t("ui.introTitle");
      document.getElementById("introP1").textContent = t("ui.introP1");
      document.getElementById("introP2").textContent = t("ui.introP2");
      document.getElementById("introP3").textContent = t("ui.introP3");
      document.getElementById("clearButton").textContent = t("ui.clear");
      document.getElementById("submitButton").textContent = t("ui.submit");
      document.getElementById("resultTitle").textContent = t("ui.resultTitle");
      document.getElementById("resultBody").textContent = t("ui.resultBody");
      document.getElementById("downloadJson").textContent = t("ui.downloadJson");
      document.getElementById("downloadCsv").textContent = t("ui.downloadCsv");
      if (shouldPostToServer() && !getCompanyCode()) {
        document.getElementById("submitButton").disabled = true;
        document.getElementById("resultBody").textContent = t("ui.missingCompany");
        resultPanel.classList.add("active");
      } else if (shouldPostToServer() && hasSubmittedBefore()) {
        document.getElementById("submitButton").disabled = true;
        document.getElementById("resultBody").textContent = t("ui.resultDuplicate");
        resultPanel.classList.add("active");
      } else {
        document.getElementById("submitButton").disabled = false;
      }
    }

    function renderQuestions() {
      questionContainer.innerHTML = sections.map((section) => {
        const body = section.questions.map((id) => renderQuestion(id)).join("");
        const languageBundle = i18n[state.language] || i18n.en;
        const sectionTitle = languageBundle.sections[section.id] || i18n.en.sections[section.id];
        return `<fieldset><legend>${sectionTitle}</legend>${body}</fieldset>`;
      }).join("");
    }

    function renderQuestion(id) {
      const question = questions[id];
      const number = Number(id.replace("q", ""));
      const meta = getMeta(question);
      const body = question.type === "text" ? renderText(id, question) : renderOptions(id, question);
      return `
        <div class="question" data-question="${id}" data-required="${question.required ? "true" : "false"}" data-max="${question.max || ""}">
          <div class="question-head">
            <span class="num">Q${number}</span>
            <div>
              <p class="question-title">${questionLabel(id)}</p>
              <p class="meta">${meta}</p>
            </div>
          </div>
          ${body}
        </div>
      `;
    }

    function getMeta(question) {
      if (question.type === "text") return t("ui.textMeta");
      if (question.type === "single") return t("ui.single");
      if (question.max) return `${t("ui.multi")}、${t("ui.max", { max: question.max })}`;
      return t("ui.multi");
    }

    function renderOptions(id, question) {
      const inputType = question.type === "single" ? "radio" : "checkbox";
      const role = question.type === "single" ? ' role="radiogroup"' : "";
      const options = question.options.map((code) => (
        `<label class="option"><input type="${inputType}" name="${id}" value="${code}"><span>${optionLabel(code)}</span></label>`
      )).join("");
      return `<div class="options"${role} aria-label="${questionLabel(id)}">${options}</div>`;
    }

    function renderText(id, question) {
      return `
        <textarea name="${id}" maxlength="${question.maxLength}" placeholder="${t("ui.placeholder")}"></textarea>
        <p class="hint">${t("ui.confidentialHint")}</p>
        <p class="counter" id="textCounter">${t("ui.counter", { count: 0 })}</p>
      `;
    }

    function renderAll() {
      const savedAnswers = getSavedAnswers();
      renderLanguageSwitcher();
      renderStaticText();
      renderQuestions();
      restoreAnswers(savedAnswers);
      if (!hasSubmittedBefore()) resultPanel.classList.remove("active");
    }

    function getValue(id) {
      const fields = [...form.querySelectorAll(`[name="${id}"]`)];
      if (!fields.length) return "";
      if (fields[0].type === "checkbox") {
        return fields.filter((field) => field.checked).map((field) => field.value);
      }
      if (fields[0].type === "radio") {
        const selected = fields.find((field) => field.checked);
        return selected ? selected.value : "";
      }
      return fields[0].value.trim();
    }

    function isAnswered(id) {
      const value = getValue(id);
      return Array.isArray(value) ? value.length > 0 : value.length > 0;
    }

    function updateProgress() {
      const total = Object.keys(questions).length;
      const answered = Object.keys(questions).filter(isAnswered).length;
      const percent = Math.round((answered / total) * 100);
      document.getElementById("progressBar").style.width = `${percent}%`;
      document.getElementById("progressText").textContent = t("ui.progress", { answered, total });
    }

    function updateTextCounter() {
      const textarea = form.querySelector('[name="q20"]');
      const counter = document.getElementById("textCounter");
      if (textarea && counter) {
        counter.textContent = t("ui.counter", { count: textarea.value.length });
      }
    }

    function removeErrors() {
      form.querySelectorAll(".error").forEach((node) => node.remove());
    }

    function addError(questionNode, message) {
      const error = document.createElement("p");
      error.className = "error";
      error.textContent = message;
      questionNode.appendChild(error);
    }

    function validateAccess() {
      const accessPanel = document.querySelector(".access-panel");
      if (!accessPanel) return true;
      accessPanel.querySelectorAll(".error").forEach((node) => node.remove());
      const companyPattern = /^[a-z0-9][a-z0-9-]{1,78}[a-z0-9]$/i;
      const responseCodePattern = /^[a-z0-9][a-z0-9-]{3,78}[a-z0-9]$/i;

      if (shouldPostToServer() && (!getCompanyCode() || !companyPattern.test(getCompanyCode()))) {
        addError(accessPanel, t("ui.missingCompany"));
        accessPanel.scrollIntoView({ behavior: "smooth", block: "center" });
        return false;
      }

      if (shouldPostToServer() && (!getResponseCode() || !responseCodePattern.test(getResponseCode()))) {
        addError(accessPanel, t("ui.responseCodeError"));
        document.getElementById("responseCode").focus({ preventScroll: true });
        accessPanel.scrollIntoView({ behavior: "smooth", block: "center" });
        return false;
      }

      return true;
    }

    function validateForm() {
      removeErrors();
      const invalid = [];

      Object.entries(questions).forEach(([id, question]) => {
        const questionNode = form.querySelector(`[data-question="${id}"]`);
        if (!questionNode) return;
        const value = getValue(id);
        if (question.required && !isAnswered(id)) {
          addError(questionNode, t("ui.requiredError"));
          invalid.push(questionNode);
        }
        if (question.type === "multi" && question.max && value.length > question.max) {
          addError(questionNode, t("ui.maxError", { max: question.max }));
          invalid.push(questionNode);
        }
      });

      if (!invalid.length) return true;
      invalid[0].scrollIntoView({ behavior: "smooth", block: "center" });
      const firstInput = invalid[0].querySelector("input, textarea");
      if (firstInput) firstInput.focus({ preventScroll: true });
      return false;
    }

    function collectResponse() {
      const answers = {};
      Object.keys(questions).forEach((id) => {
        answers[id] = getValue(id);
      });
      return {
        survey: "global_ai_readiness_survey",
        language: state.language,
        company_code: getCompanyCode(),
        response_code: getResponseCode(),
        respondent_id: getRespondentId(),
        submitted_at: new Date().toISOString(),
        answers
      };
    }

    function toCsv(response) {
      const headers = ["survey", "language", "submitted_at", ...Object.keys(response.answers)];
      const row = [
        response.survey,
        response.language,
        response.submitted_at,
        ...Object.values(response.answers).map((value) => Array.isArray(value) ? value.join(";") : value)
      ];
      const escapeCell = (value) => `"${String(value).replaceAll('"', '""')}"`;
      return `${headers.map(escapeCell).join(",")}\r\n${row.map(escapeCell).join(",")}\r\n`;
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function shouldPostToServer() {
      return window.location.protocol === "http:" || window.location.protocol === "https:";
    }

    async function postResponse(response) {
      const result = await fetch("/api/responses", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(response)
      });
      const body = await result.json().catch(() => ({}));
      if (!result.ok || !body.ok) {
        const error = new Error(body.error || `Save failed with status ${result.status}`);
        error.status = result.status;
        error.code = body.code || "";
        throw error;
      }
      return body;
    }

    document.getElementById("languageSwitcher").addEventListener("click", (event) => {
      const button = event.target.closest("[data-language]");
      if (!button) return;
      state.language = button.dataset.language;
      state.latestResponse = null;
      renderAll();
    });

    form.addEventListener("change", (event) => {
      const questionNode = event.target.closest(".question");
      if (!questionNode) return;
      const id = questionNode.dataset.question;
      const question = questions[id];
      if (question.type === "multi" && question.max) {
        const selected = getValue(id);
        if (selected.length > question.max) {
          event.target.checked = false;
          removeErrors();
          addError(questionNode, t("ui.maxError", { max: question.max }));
          setTimeout(removeErrors, 1800);
        }
      }
      state.latestResponse = null;
      resultPanel.classList.remove("active");
      updateProgress();
    });

    form.addEventListener("input", (event) => {
      if (event.target.name === "q20") updateTextCounter();
      state.latestResponse = null;
      resultPanel.classList.remove("active");
      updateProgress();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (shouldPostToServer() && hasSubmittedBefore()) {
        document.getElementById("resultBody").textContent = t("ui.resultDuplicate");
        resultPanel.classList.add("active");
        resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      if (!validateAccess()) return;
      if (!validateForm()) return;
      const submitButton = document.getElementById("submitButton");
      submitButton.disabled = true;
      state.latestResponse = collectResponse();
      try {
        if (shouldPostToServer()) {
          state.latestResponse.server_result = await postResponse(state.latestResponse);
          markSubmitted();
          submitButton.disabled = true;
          document.getElementById("resultBody").textContent = t("ui.resultBody");
        } else {
          document.getElementById("resultBody").textContent = t("ui.resultLocalOnly");
        }
        resultPanel.classList.add("active");
        resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        document.getElementById("resultBody").textContent = error.code === "duplicate_response" ? t("ui.resultDuplicate") : t("ui.resultSaveFailed");
        if (error.code === "duplicate_response") {
          markSubmitted();
          submitButton.disabled = true;
        }
        resultPanel.classList.add("active");
        resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } finally {
        if (!hasSubmittedBefore()) submitButton.disabled = false;
      }
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      form.reset();
      state.latestResponse = null;
      resultPanel.classList.remove("active");
      removeErrors();
      updateTextCounter();
      updateProgress();
    });

    document.getElementById("downloadJson").addEventListener("click", () => {
      if (!state.latestResponse) state.latestResponse = collectResponse();
      download("global_ai_readiness_survey_response.json", JSON.stringify(state.latestResponse, null, 2), "application/json;charset=utf-8");
    });

    document.getElementById("downloadCsv").addEventListener("click", () => {
      if (!state.latestResponse) state.latestResponse = collectResponse();
      download("global_ai_readiness_survey_response.csv", toCsv(state.latestResponse), "text/csv;charset=utf-8");
    });

    renderAll();
  </script>
</body>
</html>
