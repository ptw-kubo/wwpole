name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    AZURE_SUBSCRIPTION_ID: c3c1c33a-9178-4867-ba12-13ef4ebdd4dc
  AZURE_RESOURCE_GROUP: rg-dev-wwpole
  AZURE_LOCATION: japaneast
  AZURE_CONTAINER_APP_NAME: ca-global-ai-readiness-survey
  AZURE_CONTAINER_APP_ENVIRONMENT: cae-wwpole-dev
  AZURE_STORAGE_CONTAINER_NAME: survey-responses

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm run test:all

      - name: Validate GitHub Actions configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_ACR_NAME AZURE_STORAGE_ACCOUNT_NAME BASIC_AUTH_USERNAME BASIC_AUTH_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. Configure it in GitHub repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure resources
        shell: bash
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail

          : "${AZURE_ACR_NAME:?Set repository variable AZURE_ACR_NAME}"
          : "${AZURE_STORAGE_ACCOUNT_NAME:?Set repository variable AZURE_STORAGE_ACCOUNT_NAME}"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          if ! az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ACR_NAME" >/dev/null 2>&1; then
            az acr create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_ACR_NAME" \
              --sku Basic
          fi

          if ! az storage account show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STORAGE_ACCOUNT_NAME" >/dev/null 2>&1; then
            az storage account create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --location "$AZURE_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2
          fi

          az storage container create \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --name "$AZURE_STORAGE_CONTAINER_NAME"

          if ! az containerapp env show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_ENVIRONMENT" >/dev/null 2>&1; then
            az containerapp env create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_ENVIRONMENT" \
              --location "$AZURE_LOCATION"
          fi

      - name: Build image in ACR
        shell: bash
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail

          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "global-ai-readiness-survey:${GITHUB_SHA}" \
            .

      - name: Deploy Container App
        shell: bash
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          BASIC_AUTH_USERNAME: ${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail

          image="$AZURE_ACR_NAME.azurecr.io/global-ai-readiness-survey:${GITHUB_SHA}"

          if ! az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" >/dev/null 2>&1; then
            az containerapp create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" \
              --image mcr.microsoft.com/k8se/quickstart:latest \
              --target-port 80 \
              --ingress external \
              --system-assigned
          else
            az containerapp identity assign \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --system-assigned
          fi

          principal_id="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --query identity.principalId \
            --output tsv)"

          acr_id="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ACR_NAME" \
            --query id \
            --output tsv)"

          storage_id="$(az storage account show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --query id \
            --output tsv)"

          existing_acr_assignment="$(az role assignment list \
            --assignee "$principal_id" \
            --role "AcrPull" \
            --scope "$acr_id" \
            --query "length(@)" \
            --output tsv)"

          if [ "$existing_acr_assignment" = "0" ]; then
            az role assignment create \
              --assignee "$principal_id" \
              --role "AcrPull" \
              --scope "$acr_id"
          fi

          existing_storage_assignment="$(az role assignment list \
            --assignee "$principal_id" \
            --role "Storage Blob Data Contributor" \
            --scope "$storage_id" \
            --query "length(@)" \
            --output tsv)"

          if [ "$existing_storage_assignment" = "0" ]; then
            az role assignment create \
              --assignee "$principal_id" \
              --role "Storage Blob Data Contributor" \
              --scope "$storage_id"
          fi

          az containerapp registry set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --identity system \
            --server "$AZURE_ACR_NAME.azurecr.io"

          az containerapp ingress update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --target-port 8080

          az containerapp secret set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --secrets basic-auth-password="$BASIC_AUTH_PASSWORD"

          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --image "$image" \
            --set-env-vars \
              PORT=8080 \
              AZURE_STORAGE_ACCOUNT_NAME="$AZURE_STORAGE_ACCOUNT_NAME" \
              AZURE_STORAGE_CONTAINER_NAME="$AZURE_STORAGE_CONTAINER_NAME" \
              BASIC_AUTH_USERNAME="$BASIC_AUTH_USERNAME" \
              BASIC_AUTH_PASSWORD=secretref:basic-auth-password

      - name: Show app URL
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          echo "https://$fqdn"
